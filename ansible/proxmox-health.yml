---
- name: Proxmox node health check
  hosts: proxmox
  gather_facts: false

  tasks:
    - name: Check hostname
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Check Proxmox version
      ansible.builtin.command: pveversion
      register: pveversion_result
      changed_when: false

    - name: Check uptime
      ansible.builtin.command: uptime -p
      register: uptime_result
      changed_when: false

    - name: Check storage status
      ansible.builtin.command: pvesm status
      register: storage_result
      changed_when: false

    - name: Verify t-20-backup is active
      ansible.builtin.assert:
        that:
          - "'t-20-backup' in storage_result.stdout"
          - "storage_result.stdout is search('t-20-backup\\s+cifs\\s+active')"
        fail_msg: "t-20-backup is missing or inactive on {{ inventory_hostname }}"
        success_msg: "t-20-backup is active on {{ inventory_hostname }}"

    - name: Verify no Proxmox storage reports inactive or unknown
      ansible.builtin.assert:
        that:
          - "storage_result.stdout is not search('(?m)^\\S+\\s+\\S+\\s+(inactive|unknown)\\b')"
        fail_msg: "One or more storage resources are unhealthy on {{ inventory_hostname }}"
        success_msg: "All reported storage is active on {{ inventory_hostname }}"

    - name: Check critical Proxmox services
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop:
        - pve-cluster
        - corosync
        - pvedaemon
        - pveproxy
        - pvestatd
      register: proxmox_service_checks
      changed_when: false
      failed_when: false

    - name: Verify critical Proxmox services are active
      ansible.builtin.assert:
        that:
          - "item.stdout == 'active'"
        fail_msg: "{{ item.item }} is not active on {{ inventory_hostname }}"
        success_msg: "{{ item.item }} is active on {{ inventory_hostname }}"
      loop: "{{ proxmox_service_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read root filesystem usage
      ansible.builtin.shell: |
        df -P / | awk 'NR==2 {gsub(/%/, "", $5); print $5}'
      register: root_fs_pct
      changed_when: false

    - name: Read memory usage
      ansible.builtin.shell: |
        awk '
        /MemTotal:/ { total=$2 }
        /MemAvailable:/ { avail=$2 }
        END { printf "%.0f\n", ((total-avail)/total)*100 }
        ' /proc/meminfo
      register: memory_used_pct
      changed_when: false

    - name: Read swap usage
      ansible.builtin.shell: |
        free -m | awk '/^Swap:/ {
          if ($2 == 0)
            print 0
          else
            printf "%.0f\n", ($3/$2)*100
        }'
      register: swap_used_pct
      changed_when: false

    - name: Read five-minute load average
      ansible.builtin.shell: |
        awk '{print $2}' /proc/loadavg
      register: load5
      changed_when: false

    - name: Read CPU count
      ansible.builtin.command: nproc
      register: cpu_count
      changed_when: false

    - name: Verify resource pressure is within limits
      ansible.builtin.assert:
        that:
          - "root_fs_pct.stdout | int < 90"
          - "memory_used_pct.stdout | int < 95"
          - "swap_used_pct.stdout | int < 80"
          - "load5.stdout | float < (cpu_count.stdout | int) * 2"
        fail_msg: >-
          Resource pressure detected on {{ inventory_hostname }}:
          root={{ root_fs_pct.stdout }}%,
          memory={{ memory_used_pct.stdout }}%,
          swap={{ swap_used_pct.stdout }}%,
          load5={{ load5.stdout }},
          CPUs={{ cpu_count.stdout }}
        success_msg: >-
          Resource pressure normal on {{ inventory_hostname }}:
          root={{ root_fs_pct.stdout }}%,
          memory={{ memory_used_pct.stdout }}%,
          swap={{ swap_used_pct.stdout }}%,
          load5={{ load5.stdout }},
          CPUs={{ cpu_count.stdout }}

    - name: Read recent backup tasks
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ inventory_hostname }}/tasks"
          - --typefilter
          - vzdump
          - --limit
          - "10"
          - --output-format
          - json
      register: backup_tasks_raw
      changed_when: false

    - name: Parse recent backup tasks
      ansible.builtin.set_fact:
        backup_tasks: "{{ backup_tasks_raw.stdout | from_json }}"

    - name: Read current epoch time
      ansible.builtin.command: date +%s
      register: backup_current_epoch
      changed_when: false

    - name: Identify latest successful backup
      ansible.builtin.set_fact:
        latest_successful_backup: >-
          {{
            (backup_tasks
             | selectattr('status', 'equalto', 'OK')
             | list
             | first)
            | default({})
          }}

    - name: Verify a successful backup exists within 36 hours
      ansible.builtin.assert:
        that:
          - "latest_successful_backup | length > 0"
          - "(backup_current_epoch.stdout | int) - (latest_successful_backup.get('endtime', 0) | int) < 129600"
        fail_msg: "No successful backup within 36 hours on {{ inventory_hostname }}"
        success_msg: "Recent successful backup exists on {{ inventory_hostname }}"

    - name: Verify latest backup attempt succeeded
      ansible.builtin.assert:
        that:
          - "backup_tasks | length > 0"
          - "backup_tasks[0].status == 'OK'"
        fail_msg: >-
          Latest backup attempt FAILED on {{ inventory_hostname }}:
          {{ backup_tasks[0].status | default('unknown status') }}
        success_msg: "Latest backup attempt succeeded on {{ inventory_hostname }}"

    - name: Read VM inventory
      ansible.builtin.command: qm list
      register: vm_inventory
      changed_when: false

    - name: Read LXC inventory
      ansible.builtin.command: pct list
      register: lxc_inventory
      changed_when: false

    - name: Display guest inventory
      ansible.builtin.debug:
        msg:
          - "VMs:"
          - "{{ vm_inventory.stdout_lines }}"
          - "LXCs:"
          - "{{ lxc_inventory.stdout_lines }}"

    - name: Check expected running VMs
      ansible.builtin.command: "qm status {{ item.id }}"
      loop: "{{ expected_running_guests[inventory_hostname].vms }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: expected_vm_status
      changed_when: false
      failed_when: false

    - name: Verify expected VMs are running
      ansible.builtin.assert:
        that:
          - "'status: running' in item.stdout"
        fail_msg: "VM {{ item.item.id }} {{ item.item.name }} is NOT running on {{ inventory_hostname }}"
        success_msg: "VM {{ item.item.id }} {{ item.item.name }} is running"
      loop: "{{ expected_vm_status.results }}"
      loop_control:
        label: "{{ item.item.id }} {{ item.item.name }}"

    - name: Check expected running LXCs
      ansible.builtin.command: "pct status {{ item.id }}"
      loop: "{{ expected_running_guests[inventory_hostname].lxcs }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      register: expected_lxc_status
      changed_when: false
      failed_when: false

    - name: Verify expected LXCs are running
      ansible.builtin.assert:
        that:
          - "'status: running' in item.stdout"
        fail_msg: "LXC {{ item.item.id }} {{ item.item.name }} is NOT running on {{ inventory_hostname }}"
        success_msg: "LXC {{ item.item.id }} {{ item.item.name }} is running"
      loop: "{{ expected_lxc_status.results }}"
      loop_control:
        label: "{{ item.item.id }} {{ item.item.name }}"

    - name: Display node summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ hostname_result.stdout }}"
          - "Version: {{ pveversion_result.stdout }}"
          - "Uptime: {{ uptime_result.stdout }}"
          - "Root filesystem: {{ root_fs_pct.stdout }}% used"
          - "Memory: {{ memory_used_pct.stdout }}% used"
          - "Swap: {{ swap_used_pct.stdout }}% used"
          - "5-minute load: {{ load5.stdout }} across {{ cpu_count.stdout }} CPUs"

- name: Proxmox cluster quorum and consistency check
  hosts: pve01
  gather_facts: false

  tasks:
    - name: Read cluster status
      ansible.builtin.command: pvecm status
      register: cluster_result
      changed_when: false

    - name: Verify cluster is quorate
      ansible.builtin.assert:
        that:
          - "'Quorate:          Yes' in cluster_result.stdout"
        fail_msg: "Proxmox cluster is NOT quorate"
        success_msg: "Proxmox cluster is quorate"

    - name: Verify expected four-node membership
      ansible.builtin.assert:
        that:
          - "cluster_result.stdout is search('(?m)^Nodes:\\s+4\\s*$')"
          - "cluster_result.stdout is search('(?m)^Expected votes:\\s+4\\s*$')"
          - "cluster_result.stdout is search('(?m)^Total votes:\\s+4\\s*$')"
        fail_msg: "Expected four-node voting membership is not present"
        success_msg: "All four expected voting nodes are present"

    - name: Verify Proxmox versions are consistent
      ansible.builtin.assert:
        that:
          - "hostvars['pve01'].pveversion_result.stdout == hostvars['pve02'].pveversion_result.stdout"
          - "hostvars['pve01'].pveversion_result.stdout == hostvars['pve03'].pveversion_result.stdout"
          - "hostvars['pve01'].pveversion_result.stdout == hostvars['pve04'].pveversion_result.stdout"
        fail_msg: "Proxmox version or running kernel differs between nodes"
        success_msg: "All Proxmox nodes report the same version and running kernel"

    - name: Find newest Proxmox backup
      ansible.builtin.shell: |
        find /mnt/pve/t-20-backup/dump \
          -maxdepth 1 \
          -type f \
          \( -name '*.vma.zst' -o \
             -name '*.tar.zst' -o \
             -name '*.vma.lzo' -o \
             -name '*.tar.lzo' -o \
             -name '*.vma.gz' -o \
             -name '*.tar.gz' \) \
          -printf '%T@\n' 2>/dev/null |
        sort -nr |
        head -1 |
        cut -d. -f1
      register: newest_backup_epoch
      changed_when: false

    - name: Read current time
      ansible.builtin.command: date +%s
      register: current_epoch
      changed_when: false

    - name: Verify a recent backup exists
      ansible.builtin.assert:
        that:
          - "newest_backup_epoch.stdout | length > 0"
          - "(current_epoch.stdout | int) - (newest_backup_epoch.stdout | int) < 129600"
        fail_msg: "No Proxmox backup newer than 36 hours was found on t-20-backup"
        success_msg: "A Proxmox backup newer than 36 hours exists on t-20-backup"

    - name: Read newest backup timestamp
      ansible.builtin.command:
        argv:
          - date
          - -d
          - "@{{ newest_backup_epoch.stdout }}"
          - "+%Y-%m-%d %H:%M:%S %Z"
      register: newest_backup_time
      changed_when: false
      when: newest_backup_epoch.stdout | length > 0

    - name: Display newest backup time
      ansible.builtin.debug:
        msg: "Newest backup: {{ newest_backup_time.stdout }}"
      when: newest_backup_epoch.stdout | length > 0

    - name: Display cluster status
      ansible.builtin.debug:
        var: cluster_result.stdout_lines
