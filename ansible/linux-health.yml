---
- name: Linux infrastructure health check
  hosts: linux
  become: true
  gather_facts: false

  tasks:
    - name: Check hostname
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Check uptime
      ansible.builtin.command: uptime -p
      register: uptime_result
      changed_when: false

    - name: Read root filesystem usage
      ansible.builtin.shell: |
        df -P / | awk 'NR==2 {gsub(/%/, "", $5); print $5}'
      register: root_fs_pct
      changed_when: false

    - name: Read memory usage
      ansible.builtin.shell: |
        awk '
        /MemTotal:/ { total=$2 }
        /MemAvailable:/ { avail=$2 }
        END { printf "%.0f\n", ((total-avail)/total)*100 }
        ' /proc/meminfo
      register: memory_used_pct
      changed_when: false

    - name: Verify basic resource pressure
      ansible.builtin.assert:
        that:
          - "root_fs_pct.stdout | int < 90"
          - "memory_used_pct.stdout | int < 95"
        fail_msg: >-
          Resource pressure detected on {{ inventory_hostname }}:
          root={{ root_fs_pct.stdout }}%,
          memory={{ memory_used_pct.stdout }}%
        success_msg: >-
          Resource pressure normal on {{ inventory_hostname }}:
          root={{ root_fs_pct.stdout }}%,
          memory={{ memory_used_pct.stdout }}%

    - name: Check SSH service
      ansible.builtin.command: systemctl is-active ssh
      register: ssh_status
      changed_when: false
      failed_when: false

    - name: Verify SSH is active
      ansible.builtin.assert:
        that:
          - "ssh_status.stdout == 'active'"
        fail_msg: "SSH is not active on {{ inventory_hostname }}"
        success_msg: "SSH is active on {{ inventory_hostname }}"

    - name: Check Pi-hole FTL
      ansible.builtin.command: systemctl is-active pihole-FTL
      register: pihole_status
      changed_when: false
      failed_when: false
      when: inventory_hostname == 'dns01'

    - name: Verify Pi-hole FTL is active
      ansible.builtin.assert:
        that:
          - "pihole_status.stdout == 'active'"
        fail_msg: "Pi-hole FTL is not active on dns01"
        success_msg: "Pi-hole FTL is active on dns01"
      when: inventory_hostname == 'dns01'

    - name: Check Docker Engine
      ansible.builtin.command: systemctl is-active docker
      register: docker_status
      changed_when: false
      failed_when: false
      when: inventory_hostname == 'docker'

    - name: Verify Docker Engine is active
      ansible.builtin.assert:
        that:
          - "docker_status.stdout == 'active'"
        fail_msg: "Docker Engine is not active on docker"
        success_msg: "Docker Engine is active on docker"
      when: inventory_hostname == 'docker'

    - name: Inspect uptime-kuma container
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - uptime-kuma
      register: kuma_inspect_raw
      changed_when: false
      failed_when: false
      when: inventory_hostname == 'docker'

    - name: Parse uptime-kuma container state
      ansible.builtin.set_fact:
        kuma_inspect: "{{ (kuma_inspect_raw.stdout | from_json)[0] }}"
      when:
        - inventory_hostname == 'docker'
        - kuma_inspect_raw.rc == 0

    - name: Verify uptime-kuma is running and healthy
      ansible.builtin.assert:
        that:
          - "kuma_inspect_raw.rc == 0"
          - "kuma_inspect.State.Status == 'running'"
          - "kuma_inspect.State.Health.Status == 'healthy'"
        fail_msg: "uptime-kuma is missing, stopped, or unhealthy"
        success_msg: "uptime-kuma is running and healthy"
      when: inventory_hostname == 'docker'

    - name: Check LibreNMS supporting services
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop:
        - mariadb
        - nginx
        - php8.5-fpm
        - snmpd
        - cron
      register: librenms_services
      changed_when: false
      failed_when: false
      when: inventory_hostname == 'nms01'

    - name: Verify LibreNMS supporting services
      ansible.builtin.assert:
        that:
          - "item.rc == 0"
          - "item.stdout == 'active'"
        fail_msg: "LibreNMS dependency {{ item.item }} is not active"
        success_msg: "LibreNMS dependency {{ item.item }} is active"
      loop: "{{ librenms_services.results }}"
      when: inventory_hostname == 'nms01'

    - name: Check LibreNMS scheduler timer
      ansible.builtin.command: systemctl is-active librenms-scheduler.timer
      register: librenms_timer
      changed_when: false
      failed_when: false
      when: inventory_hostname == 'nms01'

    - name: Verify LibreNMS scheduler timer
      ansible.builtin.assert:
        that:
          - "librenms_timer.stdout == 'active'"
        fail_msg: "LibreNMS scheduler timer is not active"
        success_msg: "LibreNMS scheduler timer is active"
      when: inventory_hostname == 'nms01'

    - name: Check LibreNMS local web interface
      ansible.builtin.command:
        argv:
          - curl
          - -sS
          - -o
          - /dev/null
          - -w
          - "%{http_code}"
          - http://127.0.0.1/
      register: librenms_http
      changed_when: false
      failed_when: false
      when: inventory_hostname == 'nms01'

    - name: Verify LibreNMS local web interface
      ansible.builtin.assert:
        that:
          - "librenms_http.stdout in ['200', '301', '302', '303', '307', '308']"
        fail_msg: "LibreNMS local HTTP check failed: {{ librenms_http.stdout }}"
        success_msg: "LibreNMS web interface responding: HTTP {{ librenms_http.stdout }}"
      when: inventory_hostname == 'nms01'

    - name: Run LibreNMS validation
      ansible.builtin.command: ./validate.php
      args:
        chdir: /opt/librenms
      become_user: librenms
      register: librenms_validate
      changed_when: false
      failed_when: false
      when: inventory_hostname == 'nms01'

    - name: Verify LibreNMS core validation
      ansible.builtin.assert:
        that:
          - "librenms_validate.rc == 0"
          - "'[FAIL]' not in librenms_validate.stdout"
          - "'Database Connected' in librenms_validate.stdout"
          - "'Active pollers found' in librenms_validate.stdout"
          - "'Python poller wrapper is polling' in librenms_validate.stdout"
        fail_msg: "LibreNMS validation detected a core failure"
        success_msg: "LibreNMS database and polling validation passed"
      when: inventory_hostname == 'nms01'

    - name: Check Wazuh core services
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop:
        - wazuh-manager
        - wazuh-indexer
        - wazuh-dashboard
        - filebeat
      register: wazuh_services
      changed_when: false
      failed_when: false
      when: inventory_hostname == 'wazuh01'

    - name: Verify Wazuh core services
      ansible.builtin.assert:
        that:
          - "item.rc == 0"
          - "item.stdout == 'active'"
        fail_msg: "Wazuh service {{ item.item }} is not active"
        success_msg: "Wazuh service {{ item.item }} is active"
      loop: "{{ wazuh_services.results }}"
      when: inventory_hostname == 'wazuh01'

    - name: Check Wazuh manager processes
      ansible.builtin.command: /var/ossec/bin/wazuh-control status
      register: wazuh_manager_status
      changed_when: false
      failed_when: false
      when: inventory_hostname == 'wazuh01'

    - name: Verify Wazuh manager core processes
      ansible.builtin.assert:
        that:
          - "'wazuh-remoted is running' in wazuh_manager_status.stdout"
          - "'wazuh-analysisd is running' in wazuh_manager_status.stdout"
          - "'wazuh-syscheckd is running' in wazuh_manager_status.stdout"
          - "'wazuh-db is running' in wazuh_manager_status.stdout"
          - "'wazuh-authd is running' in wazuh_manager_status.stdout"
          - "'wazuh-apid is running' in wazuh_manager_status.stdout"
        fail_msg: "One or more required Wazuh manager processes are not running"
        success_msg: "Wazuh manager core processes are running"
      when: inventory_hostname == 'wazuh01'

    - name: Check Wazuh dashboard HTTPS
      ansible.builtin.command:
        argv:
          - curl
          - -k
          - -sS
          - -o
          - /dev/null
          - -w
          - "%{http_code}"
          - https://127.0.0.1/
      register: wazuh_dashboard_http
      changed_when: false
      failed_when: false
      when: inventory_hostname == 'wazuh01'

    - name: Verify Wazuh dashboard HTTPS
      ansible.builtin.assert:
        that:
          - "wazuh_dashboard_http.stdout in ['200', '301', '302', '303', '307', '308']"
        fail_msg: "Wazuh dashboard HTTP check failed: {{ wazuh_dashboard_http.stdout }}"
        success_msg: "Wazuh dashboard responding: HTTPS {{ wazuh_dashboard_http.stdout }}"
      when: inventory_hostname == 'wazuh01'

    - name: Check Wazuh indexer HTTPS
      ansible.builtin.command:
        argv:
          - curl
          - -k
          - -sS
          - -o
          - /dev/null
          - -w
          - "%{http_code}"
          - https://127.0.0.1:9200/
      register: wazuh_indexer_http
      changed_when: false
      failed_when: false
      when: inventory_hostname == 'wazuh01'

    - name: Verify Wazuh indexer HTTPS
      ansible.builtin.assert:
        that:
          - "wazuh_indexer_http.stdout in ['200', '401', '403']"
        fail_msg: "Wazuh indexer HTTP check failed: {{ wazuh_indexer_http.stdout }}"
        success_msg: "Wazuh indexer responding: HTTPS {{ wazuh_indexer_http.stdout }}"
      when: inventory_hostname == 'wazuh01'

    - name: Check Wazuh API HTTPS
      ansible.builtin.command:
        argv:
          - curl
          - -k
          - -sS
          - -o
          - /dev/null
          - -w
          - "%{http_code}"
          - https://127.0.0.1:55000/
      register: wazuh_api_http
      changed_when: false
      failed_when: false
      when: inventory_hostname == 'wazuh01'

    - name: Verify Wazuh API HTTPS
      ansible.builtin.assert:
        that:
          - "wazuh_api_http.stdout in ['200', '401', '403']"
        fail_msg: "Wazuh API HTTP check failed: {{ wazuh_api_http.stdout }}"
        success_msg: "Wazuh API responding: HTTPS {{ wazuh_api_http.stdout }}"
      when: inventory_hostname == 'wazuh01'

    - name: Display Linux host summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ hostname_result.stdout }}"
          - "Uptime: {{ uptime_result.stdout }}"
          - "Root filesystem: {{ root_fs_pct.stdout }}% used"
          - "Memory: {{ memory_used_pct.stdout }}% used"
